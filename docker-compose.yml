name: homi

services:
  php:
    build:
      context: ./docker/php
    container_name: homi_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      TZ: Asia/Manila
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homi_net

  nginx:
    image: nginx:1.27-alpine
    container_name: homi_nginx
    ports:
      - "8580:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - homi_net

  db:
    image: mysql:8.0
    container_name: homi_db
    ports:
      - "5506:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homi
      MYSQL_USER: homi
      MYSQL_PASSWORD: homi
      TZ: Asia/Manila
    volumes:
      - homi_db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - homi_net

  phpmyadmin:
    image: phpmyadmin:5
    container_name: homi_phpmyadmin
    ports:
      - "7171:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homi_net

  mailpit:
    image: axllent/mailpit
    container_name: homi_mailpit
    ports:
      - "7125:8025"
      - "4125:1025"
    networks:
      - homi_net

networks:
  homi_net:
    name: homi_net

volumes:
  homi_db_data:
    name: homi_db_data
